<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mafia">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060f'/%3E%3Ctext x='32' y='46' font-family='Arial Black,Arial' font-weight='900' font-size='40' text-anchor='middle' fill='%23ff2bd6'%3EM%3C/text%3E%3C/svg%3E">
  <title>Mafia — Tungi shahar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800;900&family=Limelight&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet">
  <script>
    // Uslubni sahifa chizilishidan oldin qo'yamiz — "miltillash" bo'lmasligi uchun
    try { document.documentElement.dataset.theme = localStorage.getItem('mafia-theme') || 'neon'; }
    catch (e) { document.documentElement.dataset.theme = 'neon'; }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="phase-home">

  <!-- Fon: harakatlanuvchi neon nurlar, to'r va shahar silueti -->
  <div class="bg-glow" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div id="skyline" class="skyline" aria-hidden="true"></div>
  <div class="bg-noir" aria-hidden="true"><i class="blinds"></i><i class="rain"></i></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ───────── BOSH SAHIFA ───────── -->
  <section id="home" class="screen">
    <div class="home-wrap">
      <div class="home-top">
        <div class="theme-switch" role="group" aria-label="Neon / Noir">
          <button type="button" data-theme-pick="neon">✦ Neon</button>
          <button type="button" data-theme-pick="noir">🎩 Noir</button>
        </div>
        <select class="lang-select" data-lang-select aria-label="Til / Язык / Language"></select>
      </div>
      <h1 class="logo" aria-label="Mafia">
        <span>M</span><span>A</span><span class="flicker">F</span><span>I</span><span>A</span>
      </h1>
      <p class="tagline" data-i18n="home.tagline"></p>

      <div class="glass home-card">
        <div class="profile">
          <button type="button" id="avatarPreview" class="avatar-xl" data-i18n-title="home.avatarTitle"></button>
          <label class="field">
            <span data-i18n="home.nameLabel"></span>
            <input id="nameInput" maxlength="16" data-i18n-ph="home.namePh" autocomplete="off">
          </label>
        </div>

        <div class="picker">
          <div id="emojiGrid" class="emoji-grid"></div>
          <div id="colorRow" class="color-row"></div>
        </div>

        <button id="createBtn" class="btn primary wide" data-i18n="home.create"></button>

        <div class="divider"><span data-i18n="home.or"></span></div>

        <div class="row">
          <input id="codeInput" maxlength="5" data-i18n-ph="home.codePh" autocomplete="off">
          <button id="joinBtn" class="btn neon" data-i18n="home.join"></button>
        </div>
        <div id="passRow" class="pass-row hidden">
          <input id="passInput" type="password" maxlength="20" data-i18n-ph="home.passPh" autocomplete="off">
        </div>
        <p id="homeError" class="error"></p>
        <button id="spectateBtn" class="btn neon wide hidden" data-i18n="home.spectate"></button>
      </div>

      <div class="glass public-box">
        <h3 data-i18n="pub.title"></h3>
        <ul id="publicList" class="public-list"></ul>
      </div>
      <p class="hint" data-i18n="home.hint"></p>
      <p id="serverNote" class="server-note hidden"></p>
      <button id="installBtn" class="btn install-btn hidden" data-i18n="home.install"></button>
      <p id="iosHint" class="ios-hint hidden" data-i18n-html="home.iosHint"></p>
    </div>
  </section>

  <!-- ───────── O'YIN ───────── -->
  <section id="game" class="screen hidden">
    <header class="topbar glass">
      <div class="room">
        <span class="room-label" data-i18n="game.table"></span> <b id="roomCode"></b>
        <button id="copyBtn" class="btn tiny" data-i18n-title="game.copyTitle">🔗<span class="hide-sm" data-i18n="game.invite"></span></button>
        <span id="specCount" class="spec-count hidden" data-i18n-title="game.specTitle"></span>
      </div>
      <div id="phaseLabel" class="phase-label"></div>
      <div class="top-right">
        <div id="timerRing" class="timer-ring"><span id="timer" class="timer"></span></div>
        <button id="themeBtn" class="btn tiny ghost icon-btn" data-i18n-title="game.themeTitle">🎨</button>
        <button id="soundBtn" class="btn tiny ghost icon-btn" data-i18n-title="game.soundTitle">🔊</button>
        <button id="leaveBtn" class="btn tiny ghost icon-btn" data-i18n-title="game.leaveTitle">✕</button>
      </div>
    </header>

    <div id="awakeBanner" class="awake-banner hidden"></div>
    <div id="specBanner" class="spec-banner hidden" data-i18n="game.specBanner"></div>

    <main class="layout">
      <div class="table-wrap">
        <div class="table"><div id="center" class="table-center"></div></div>
        <div id="seats" class="seats"></div>
        <div id="reactLayer" class="react-layer" aria-hidden="true"></div>
        <div id="reactDock" class="react-dock hidden">
          <div id="reactMenu" class="react-menu glass hidden"></div>
          <button type="button" id="reactBtn" class="react-btn glass" data-i18n-title="game.reactTitle">😀</button>
        </div>
      </div>

      <aside class="panel">
        <div class="pane" data-pane="me">
          <div id="myRole" class="role-card glass"></div>
          <div id="voiceBox" class="box glass voice-box"></div>
          <details class="box glass prefs-box">
            <summary data-i18n="prefs.title"></summary>
            <div class="pref-row"><span data-i18n="prefs.lang"></span><select class="lang-select" data-lang-select></select></div>
            <div class="pref-row"><span data-i18n="prefs.theme"></span>
              <div class="seg mini"><button type="button" data-theme-pick="neon">✦ Neon</button><button type="button" data-theme-pick="noir">🎩 Noir</button></div>
            </div>
          </details>
        </div>
        <div class="pane" data-pane="log">
          <div class="box glass log-box">
            <h3 data-i18n="log.title"></h3>
            <ul id="log"></ul>
          </div>
        </div>
        <div class="pane" data-pane="chat">
          <div class="box glass chat-box">
            <h3 id="chatTitle"></h3>
            <ul id="chatList"></ul>
            <form id="chatForm">
              <input id="chatInput" maxlength="200" autocomplete="off" >
              <button class="btn primary send" type="submit" data-i18n-aria="chat.send">➤</button>
            </form>
          </div>
        </div>
      </aside>
    </main>

    <!-- Telefon uchun pastki tablar -->
    <nav id="tabs" class="tabs glass">
      <button type="button" data-tab="me" class="active">🎭<span data-i18n="tabs.me"></span></button>
      <button type="button" data-tab="log">📜<span data-i18n="tabs.log"></span><i class="dot" id="logDot"></i></button>
      <button type="button" data-tab="chat">💬<span data-i18n="tabs.chat"></span><i class="dot" id="chatDot"></i></button>
    </nav>

    <!-- Tun: uyg'oq bo'lmaganlarning ekrani qorong'ulashadi -->
    <div id="nightOverlay" class="night-overlay hidden">
      <div class="stars"></div>
      <div class="moon-glow"></div>
      <div class="sleep">
        <div class="eyes">😴</div>
        <h2 data-i18n="night.close"></h2>
        <p class="sleep-sub" data-i18n="night.sleeps"></p>
        <p id="nightStep" class="night-step"></p>
        <p id="nightTimer" class="night-timer"></p>
      </div>
    </div>

    <!-- Rol kartasi: bosib ag'dariladi -->
    <div id="roleModal" class="modal hidden">
      <div id="flipCard" class="flip-card">
        <div class="flip-inner">
          <div class="face back">
            <div class="back-logo">M</div>
            <p class="back-hint" data-i18n="card.flipHint"></p>
          </div>
          <div class="face front" id="roleFront">
            <div class="stamp" data-i18n="card.stamp"></div>
            <p class="modal-top" data-i18n="card.yourRole"></p>
            <div id="roleModalIcon" class="big-icon"></div>
            <h2 id="roleModalName"></h2>
            <p id="roleModalDesc"></p>
            <p id="roleModalTeam" class="team-line"></p>
            <button id="roleModalClose" class="btn primary" data-i18n="card.ok"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Xona sozlamalari (faqat xona egasi uchun) -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card glass settings-card">
      <h2 data-i18n="set.title"></h2>
      <div id="settingsBody"></div>
      <div class="settings-actions">
        <button id="settingsCancel" class="btn" data-i18n="common.cancel"></button>
        <button id="settingsSave" class="btn primary" data-i18n="common.save"></button>
      </div>
    </div>
  </div>

  <!-- Lobbida avatarni almashtirish -->
  <div id="avatarModal" class="modal hidden">
    <div class="modal-card glass avatar-card">
      <h2 data-i18n="avatar.title"></h2>
      <div id="avatarModalPreview" class="avatar-xl"></div>
      <div id="emojiGrid2" class="emoji-grid"></div>
      <div id="colorRow2" class="color-row"></div>
      <div class="settings-actions">
        <button id="avatarCancel" class="btn" data-i18n="common.cancel"></button>
        <button id="avatarSave" class="btn primary" data-i18n="common.save"></button>
      </div>
    </div>
  </div>

  <!-- O'yin yakunidagi xulosa ("sud xronikasi") -->
  <div id="recapModal" class="modal hidden">
    <div class="modal-card glass recap-card">
      <div class="recap-mast"><span data-i18n="recap.issue"></span><b data-i18n="recap.mast"></b><span id="recapDate"></span></div>
      <h2 class="recap-title" data-i18n="recap.title"></h2>
      <p id="recapWinner" class="recap-winner"></p>
      <h3 class="recap-h" data-i18n="recap.who"></h3>
      <div id="recapRoster" class="recap-roster"></div>
      <h3 class="recap-h" data-i18n="recap.timeline"></h3>
      <div id="recapTimeline" class="recap-timeline"></div>
      <div class="settings-actions"><button id="recapClose" class="btn primary" data-i18n="common.close"></button></div>
    </div>
  </div>

  <!-- Xona egasi uchun: o'yinchi menyusi -->
  <div id="playerModal" class="modal hidden">
    <div class="modal-card glass player-card">
      <div id="playerModalAvatar" class="avatar-xl"></div>
      <h2 id="playerModalName"></h2>
      <p id="playerModalInfo" class="set-note"></p>
      <div class="player-actions">
        <button id="pmHost" class="btn" data-i18n="pm.host"></button>
        <button id="pmKick" class="btn danger"></button>
        <button id="pmClose" class="btn ghost" data-i18n="common.close"></button>
      </div>
    </div>
  </div>

  <!-- Fazalar almashganda sahna effekti -->
  <div id="phaseFx" class="phase-fx" aria-hidden="true"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="i18n.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="sound.js"></script>
  <script src="voice.js"></script>
  <script src="client.js"></script>
</body>
</html>
